<style>
  :root {
    --sage: #7c9a7e;
    --sage-light: #e8f0e8;
    --sage-dark: #4a6b4c;
    --cream: #faf8f3;
    --text-main: #2c2c2c;
    --text-muted: #8a8a8a;
    --danger: #c0392b;
    --danger-light: #fdecea;
    --warning: #d4874a;
    --warning-light: #fef3e7;
    --ok: #5a9e6f;
    --ok-light: #eaf4ed;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background-color: #e8e4dd;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .app-wrapper {
    width: 100%;
    max-width: 620px;
    background-color: var(--cream);
    min-height: 100vh;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.12);
  }

  /* ── Header ── */
  .app-header {
    background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 60%, #9ab89c 100%);
    padding: 2rem 1.5rem 3.5rem;
    position: relative;
    overflow: hidden;
  }
  .app-header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
  }
  .app-header::after {
    content: '';
    position: absolute;
    bottom: -60px; left: 30%;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }
  .header-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.9rem;
    color: white;
    letter-spacing: 0.02em;
  }
  .header-subtitle {
    color: rgba(255,255,255,0.75);
    font-size: 0.8rem;
    margin-top: 0.25rem;
    letter-spacing: 0.05em;
    font-weight: 300;
  }

  /* ── Sync status ── */
  .sync-status {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-top: 0.6rem;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.85);
    font-weight: 500;
  }
  .sync-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #aaa;
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .sync-dot.connected  { background: #7eff91; }
  .sync-dot.syncing    { background: #ffe07a; animation: pulse 0.8s infinite; }
  .sync-dot.error      { background: #ff7a7a; }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  /* ── Summary bar ── */
  .summary-bar {
    background: white;
    border-radius: 16px;
    margin: -1.5rem 1rem 0;
    padding: 1rem 1.25rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    display: flex;
    gap: 1rem;
    position: relative;
    z-index: 10;
  }
  .summary-item { flex: 1; text-align: center; }
  .summary-num  { font-size: 1.6rem; font-weight: 700; line-height: 1; }
  .summary-label { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.2rem; }
  .summary-divider { width: 1px; background: #eee; align-self: stretch; }

  /* ── Main ── */
  .main-content { padding: 1.5rem 1rem 6rem; }

  .section-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.75rem;
    margin-top: 1.5rem;
  }

  /* ── Category card ── */
  .category-card {
    background: white;
    border-radius: 16px;
    margin-bottom: 1rem;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    transition: box-shadow 0.2s, opacity 0.2s;
  }
  .category-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.09); }
  .category-card.dragging { opacity: 0.4; }
  .category-card.drag-over-cat {
    box-shadow: 0 0 0 2px var(--sage), 0 4px 20px rgba(124,154,126,0.25);
  }

  .category-header {
    display: flex;
    align-items: center;
    padding: 0.9rem 1.1rem 0.9rem 0.6rem;
    user-select: none;
    gap: 0.6rem;
    background: white;
    border-bottom: 1px solid #f5f5f5;
  }
  .cat-drag-handle {
    color: #ccc; font-size: 1rem; cursor: grab;
    padding: 0 0.2rem; flex-shrink: 0; line-height: 1; user-select: none;
  }
  .cat-drag-handle:hover { color: var(--sage); }
  .cat-drag-handle:active { cursor: grabbing; }
  .cat-header-clickable {
    display: flex; align-items: center; gap: 0.6rem;
    flex: 1; cursor: pointer; min-width: 0;
  }
  .category-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--sage-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; flex-shrink: 0;
  }
  .category-name { font-size: 0.95rem; font-weight: 600; flex: 1; color: var(--text-main); }
  .category-badge { font-size: 0.65rem; padding: 0.2rem 0.55rem; border-radius: 20px; font-weight: 600; }
  .badge-danger { background: var(--danger-light); color: var(--danger); }
  .badge-normal { background: var(--sage-light); color: var(--sage-dark); }
  .chevron { color: var(--text-muted); font-size: 0.75rem; transition: transform 0.25s; flex-shrink: 0; }
  .chevron.open { transform: rotate(90deg); }

  .tasks-list { padding: 0.25rem 0; }

  /* ── Task item ── */
  .task-item {
    padding: 0.85rem 1.1rem 0.85rem 0.6rem;
    border-bottom: 1px solid #f7f7f7;
    display: flex; align-items: center; gap: 0.8rem;
    transition: background 0.15s;
  }
  .task-item:last-child { border-bottom: none; }
  .task-item:hover { background: #fafafa; }
  .task-item.overdue { background: #fff8f8; border-left: 3px solid var(--danger); }
  .task-item.overdue:hover { background: #fff0f0; }
  .task-item.drag-over { background: var(--sage-light) !important; border-top: 2px dashed var(--sage); }
  .task-item.dragging { opacity: 0.4; }

  .drag-handle {
    color: #ccc; font-size: 1rem; cursor: grab;
    padding: 0 0.2rem; flex-shrink: 0; line-height: 1;
    user-select: none; touch-action: none;
  }
  .drag-handle:hover { color: var(--sage); }
  .drag-handle:active { cursor: grabbing; }

  .task-info { flex: 1; min-width: 0; }
  .task-name {
    font-size: 0.88rem; font-weight: 500; color: var(--text-main);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; max-width: 100%;
  }
  .task-name:hover .edit-hint { opacity: 1; }
  .edit-hint { opacity: 0; font-size: 0.7rem; color: var(--sage); transition: opacity 0.15s; flex-shrink: 0; }
  .task-name-edit {
    font-size: 0.88rem; font-weight: 500; font-family: inherit;
    color: var(--text-main); border: none; border-bottom: 2px solid var(--sage);

  }

  .task-meta {

  .date-edit-input {
    font-size: 0.72rem; font-family: inherit; color: var(--text-main);

  }
  .cycle-edit-input {
    font-size: 0.72rem; font-family: inherit; color: var(--text-main);

  }

  .countdown-badge {
    font-size: 0.72rem; font-weight: 700; padding: 0.25rem 0.6rem;

  }
  .countdown-overdue { background: var(--danger-light); color: var(--danger); }

  .btn-complete {
    background: var(--sage-light); color: var(--sage-dark); border: none;

  .btn-delete-task {
    background: none; border: none; color: #ccc; cursor: pointer;
    font-size: 0.85rem; padding: 0.25rem; flex-shrink: 0; transition: color 0.15s; line-height: 1;
  }
  .btn-delete-task:hover { color: var(--danger); }

  /* ── Progress bar ── */
  .progress-bar { height: 4px; background: #eee; border-radius: 2px; overflow: hidden; margin-top: 0.4rem; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

  /* ── Memo ── */
  .memo-row { margin-top: 0.45rem; display: flex; align-items: flex-start; gap: 0.3rem; }
  .memo-toggle {
    font-size: 0.68rem; color: var(--text-muted); cursor: pointer;
    background: none; border: none; padding: 0; font-family: inherit;
    display: flex; align-items: center; gap: 0.2rem; white-space: nowrap; transition: color 0.15s;
  }
  .memo-toggle:hover { color: var(--sage-dark); }
  .memo-toggle.has-memo { color: var(--sage-dark); font-weight: 600; }
  .memo-text { font-size: 0.72rem; color: #555; line-height: 1.55; white-space: pre-wrap; word-break: break-all; flex: 1; }
  .memo-textarea {
    flex: 1; font-size: 0.75rem; font-family: inherit; color: var(--text-main);

  }
  .memo-textarea:focus { border-color: var(--sage-dark); }

  /* ── Add task form ── */
  .add-task-form {
    padding: 0.6rem 1.1rem 0.9rem; display: flex; gap: 0.5rem;
    border-top: 1px solid #f0f0f0; background: #fafafa;

  .add-task-form input[type="text"] {
    flex: 1; border: 1.5px solid #e8e8e8; border-radius: 9px;
    padding: 0.45rem 0.65rem; font-size: 0.8rem; font-family: inherit;
    outline: none; color: var(--text-main); background: white; min-width: 0;
  }
  .add-task-form input[type="text"]:focus { border-color: var(--sage); }
  .add-task-form input[type="number"] {
    width: 70px; border: 1.5px solid #e8e8e8; border-radius: 9px;
    padding: 0.45rem 0.5rem; font-size: 0.8rem; font-family: inherit;
    outline: none; color: var(--text-main); background: white; flex-shrink: 0;
  }
  .add-task-form input[type="number"]:focus { border-color: var(--sage); }
  .btn-add-task {
    background: var(--sage); color: white; border: none; border-radius: 9px;
    padding: 0.45rem 0.8rem; font-size: 0.8rem; font-weight: 600;
    cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0;
    transition: background 0.15s;
  }
  .btn-add-task:hover { background: var(--sage-dark); }

  .delete-category-row {
    padding: 0.4rem 1.1rem 0.5rem; background: #fafafa;
    display: flex; justify-content: flex-end; border-top: 1px solid #f0f0f0;
  }
  .btn-delete-category {
    background: none; border: 1px solid #e0e0e0; border-radius: 8px;
    color: var(--text-muted); font-size: 0.7rem; padding: 0.3rem 0.65rem;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .btn-delete-category:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }

  /* ── Add category panel ── */
  .add-category-panel {
    background: white; border-radius: 16px; padding: 1.1rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05); margin-top: 0.5rem;
  }
  .add-category-panel h3 {
    font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
    letter-spacing: 0.08em; margin-bottom: 0.75rem; text-transform: uppercase;
  }
  .emoji-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.65rem; }
  .emoji-btn {
    width: 34px; height: 34px; border: 1.5px solid #e8e8e8; border-radius: 9px;
    background: white; cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .emoji-btn.selected { border-color: var(--sage); background: var(--sage-light); }
  .emoji-btn:hover { background: var(--sage-light); }
  .add-row { display: flex; gap: 0.5rem; align-items: center; }
  .add-row input {
    flex: 1; border: 1.5px solid #e8e8e8; border-radius: 9px;
    padding: 0.55rem 0.75rem; font-size: 0.85rem; font-family: inherit;
    outline: none; color: var(--text-main); background: white;
  }
  .add-row input:focus { border-color: var(--sage); }
  .btn-add-category {
    background: var(--sage); color: white; border: none; border-radius: 9px;
    padding: 0.55rem 1.1rem; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: background 0.15s; white-space: nowrap;
  }
  .btn-add-category:hover { background: var(--sage-dark); }

  /* ── FAB ── */
  .fab {
    position: sticky; bottom: 1.5rem;
    margin-left: auto; margin-right: 1.5rem;
    display: flex; width: fit-content;
    background: var(--sage-dark); color: white; border: none;
    border-radius: 50px; padding: 0.8rem 1.3rem;
    font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: inherit;
    box-shadow: 0 6px 24px rgba(74,107,76,0.45);
    align-items: center; gap: 0.4rem;
    transition: all 0.2s; z-index: 100;
  }
  .fab:hover { background: var(--sage); transform: translateY(-2px); }

  /* ── Toast ── */
  .toast {
    position: fixed; top: 1rem; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: #222; color: white; padding: 0.65rem 1.2rem;
    border-radius: 50px; font-size: 0.82rem; font-weight: 500;
    z-index: 9999; transition: transform 0.3s cubic-bezier(.17,.67,.35,1.2);
    white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.82rem; }

  @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .pop { animation: pop 0.25s ease; }

  /* ── Loading overlay ── */
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(250,248,243,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9998; gap: 1rem;
  }
  .loading-spinner {
    width: 40px; height: 40px; border: 3px solid var(--sage-light);
    border-top-color: var(--sage-dark); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading-text { font-size: 0.85rem; color: var(--text-muted); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app-wrapper">

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">データを読み込み中…</div>
</div>

<!-- Header -->
<div class="app-header">
  <div class="header-title">🏡 おうちケアノート</div>
  <div class="header-subtitle">Home Maintenance Tracker</div>
  <div class="sync-status">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncLabel">接続中…</span>
  </div>
</div>

<!-- Summary Bar -->
<div class="summary-bar" id="summaryBar">
  <div class="summary-item">
    <div class="summary-num" id="sumTotal" style="color: var(--sage-dark)">0</div>
    <div class="summary-label">全タスク</div>
  </div>
  <div class="summary-divider"></div>
  <div class="summary-item">
    <div class="summary-num" id="sumOverdue" style="color: var(--danger)">0</div>
    <div class="summary-label">期限切れ</div>
  </div>
  <div class="summary-divider"></div>
  <div class="summary-item">
    <div class="summary-num" id="sumSoon" style="color: var(--warning)">0</div>
    <div class="summary-label">7日以内</div>
  </div>
  <div class="summary-divider"></div>
  <div class="summary-item">
    <div class="summary-num" id="sumOk" style="color: var(--ok)">0</div>
    <div class="summary-label">余裕あり</div>
  </div>
</div>

<!-- Main -->
<div class="main-content" id="mainContent"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- FAB -->
<button class="fab" id="fabBtn">
  <span id="fabIcon">＋</span>
  <span id="fabLabel">カテゴリ追加</span>
</button>

<script>
// ─── Firestore REST API 設定 ──────────────────────────────────────────────────
const PROJECT_ID = 'home-maintenance-tracker-310b2';
const API_KEY    = 'AIzaSyBHX3QC2e7f0x2Zq7PxzctKOwBL9QyHK-M';
const BASE_URL   = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/ouchikea/main`;

// Firestore REST: データ読み込み
async function loadFromFirestore() {
  const res = await fetch(`${BASE_URL}?key=${API_KEY}`);
  if (res.status === 404) return null; // ドキュメントなし
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const doc = await res.json();
  const raw = doc.fields?.categories?.stringValue;
  return raw ? JSON.parse(raw) : null;
}

// Firestore REST: データ保存
async function saveToFirestore(data) {
  const body = {
    fields: {
      categories: { stringValue: JSON.stringify(data) }
    }
  };
  const res = await fetch(`${BASE_URL}?key=${API_KEY}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

// ─── 同期ステータス表示 ───────────────────────────────────────────────────────
function setSyncStatus(state) {
  const dot   = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  dot.className = 'sync-dot ' + state;
  if (state === 'connected') label.textContent = '同期済み ✓';
  if (state === 'syncing')   label.textContent = '保存中…';
  if (state === 'error')     label.textContent = '同期エラー';
}

// ─── 初期データ ───────────────────────────────────────────────────────────────
function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}

const DEFAULT_DATA = [
  {
    id: 'c1', name: '加湿器', icon: '💧', open: true,
    tasks: [
      { id: 't1', name: 'フィルター・トレー掃除', cycle: 14, lastDone: daysAgo(10), memo: '' },
      { id: 't2', name: 'クエン酸洗浄', cycle: 30, lastDone: daysAgo(32), memo: '' }
    ]
  },
  {
    id: 'c2', name: '靴', icon: '👟', open: true,
    tasks: [
      { id: 't3', name: '防水・防臭スプレー', cycle: 30, lastDone: daysAgo(5), memo: '' }
    ]
  },
  {
    id: 'c3', name: '自転車', icon: '🚴', open: true,
    tasks: [
      { id: 't4', name: 'タイヤの空気入れ', cycle: 60, lastDone: daysAgo(20), memo: '' },
      { id: 't5', name: 'チェーン注油', cycle: 90, lastDone: daysAgo(95), memo: '' }
    ]
  },
  {
    id: 'c4', name: '空気清浄機', icon: '🌬️', open: true,
    tasks: [
      { id: 't6', name: 'プレフィルター掃除', cycle: 14, lastDone: daysAgo(14), memo: '' }
    ]
  }
];

// ─── State ────────────────────────────────────────────────────────────────────
let appData      = [];
let editingTask  = null;
let editingDate  = null;
let editingCycle = null;
let editingMemo  = null;
let openMemos    = {};
let addPanelOpen = false;
let selectedEmoji = '🏠';
let lastSavedHash = ''; // 変更検知用

// ─── Firestore 保存 ───────────────────────────────────────────────────────────
async function saveData() {
  setSyncStatus('syncing');
  try {
    await saveToFirestore(appData);
    lastSavedHash = JSON.stringify(appData);
    setSyncStatus('connected');
  } catch(e) {
    console.error(e);
    setSyncStatus('error');
    showToast('❌ 保存に失敗しました。ネット接続を確認してください。');
    // フォールバック: localStorageにも保存
    localStorage.setItem('ouchikea_v2', JSON.stringify(appData));
  }
}

// ─── ポーリングで他端末の変更を検知（30秒ごと）────────────────────────────────
async function pollForUpdates() {
  try {
    const remote = await loadFromFirestore();
    if (!remote) return;
    const remoteHash = JSON.stringify(remote);
    if (remoteHash !== lastSavedHash && remoteHash !== JSON.stringify(appData)) {
      appData = remote;
      lastSavedHash = remoteHash;
      renderApp();
      showToast('🔄 別の端末からデータが更新されました');
    }
  } catch(e) {
    // ポーリングエラーは無視（静かに失敗）
  }
}

// ─── 初回ロード ───────────────────────────────────────────────────────────────
async function startRealtimeSync() {
  try {
    const remote = await loadFromFirestore();
    if (remote) {
      appData = remote;
      lastSavedHash = JSON.stringify(remote);
    } else {
      // Firestoreにデータなし → 初期データを書き込む
      appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
      await saveToFirestore(appData);
      lastSavedHash = JSON.stringify(appData);
    }
    setSyncStatus('connected');
  } catch(e) {
    console.error(e);
    setSyncStatus('error');
    showToast('❌ Firestoreへの接続に失敗しました');
    // フォールバック: localStorageから読む
    try {
      const raw = localStorage.getItem('ouchikea_v2');
      appData = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_DATA));
    } catch(_) {
      appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
  }
  document.getElementById('loadingOverlay').style.display = 'none';
  renderApp();
  // 30秒ごとに他端末の更新をチェック
  setInterval(pollForUpdates, 30000);
}

// ─── Date Utils ───────────────────────────────────────────────────────────────
function todayStr() { return new Date().toISOString().slice(0, 10); }

function daysRemaining(lastDone, cycle) {
  const today = new Date(); today.setHours(0,0,0,0);
  const last  = new Date(lastDone); last.setHours(0,0,0,0);
  const next  = new Date(last); next.setDate(last.getDate() + cycle);
  return Math.ceil((next - today) / (1000 * 60 * 60 * 24));
}

function formatDate(str) {
  const d = new Date(str);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function nextDate(lastDone, cycle) {
  const d = new Date(lastDone);
  d.setDate(d.getDate() + cycle);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function uid() { return Math.random().toString(36).slice(2, 9); }

// ─── Summary ─────────────────────────────────────────────────────────────────
function updateSummary() {
  let total = 0, overdue = 0, soon = 0, ok = 0;
  appData.forEach(cat => {
    cat.tasks.forEach(t => {
      total++;
      const rem = daysRemaining(t.lastDone, t.cycle);
      if (rem < 0) overdue++;
      else if (rem <= 7) soon++;
      else ok++;
    });
  });
  document.getElementById('sumTotal').textContent   = total;
  document.getElementById('sumOverdue').textContent = overdue;
  document.getElementById('sumSoon').textContent    = soon;
  document.getElementById('sumOk').textContent      = ok;
}

// ─── Render ───────────────────────────────────────────────────────────────────
const EMOJI_OPTIONS = ['💧','👟','🚴','🌬️','🧹','🛁','🪴','🏠','🔧','🪟','🍳','🧺','🖥️','💡','🚗','🐾','📦','❄️'];

function toggleAddPanel() {
  addPanelOpen = !addPanelOpen;
  document.getElementById('fabIcon').textContent = addPanelOpen ? '✕' : '＋';
  document.getElementById('fabLabel').textContent = addPanelOpen ? '閉じる' : 'カテゴリ追加';
  renderApp();
  if (addPanelOpen) setTimeout(() => document.getElementById('newCatName')?.focus(), 100);
}

function renderApp() {
  const container = document.getElementById('mainContent');
  let html = '';

  const hasAnyOverdue = appData.some(c => c.tasks.some(t => daysRemaining(t.lastDone, t.cycle) < 0));
  if (hasAnyOverdue) html += `<div class="section-title">⚠ 期限切れのタスクがあります</div>`;

  appData.forEach(cat => {
    const hasOverdue   = cat.tasks.some(t => daysRemaining(t.lastDone, t.cycle) < 0);
    const overdueCount = cat.tasks.filter(t => daysRemaining(t.lastDone, t.cycle) < 0).length;
    const badgeClass   = hasOverdue ? 'badge-danger' : 'badge-normal';
    const badgeText    = hasOverdue ? `${overdueCount}件 期限切れ` : `${cat.tasks.length}件`;
    const chevronClass = cat.open ? 'open' : '';

    html += `<div class="category-card" id="card-${cat.id}" data-cat-id="${cat.id}">`;
    html += `<div class="category-header">
      <span class="cat-drag-handle" draggable="true" data-cat-drag="${cat.id}" title="ドラッグしてカテゴリを並べ替え">⠿</span>
      <div class="cat-header-clickable" data-action="toggleCatHeader" data-cat="${cat.id}">
        <div class="category-icon">${cat.icon}</div>
        <div class="category-name">${escapeHtml(cat.name)}</div>
        <span class="category-badge ${badgeClass}">${badgeText}</span>
        <span class="chevron ${chevronClass}">▶</span>
      </div>
    </div>`;

    if (cat.open) {
      html += `<div class="tasks-container"><div class="tasks-list">`;
      if (cat.tasks.length === 0) {
        html += `<div class="empty-state">タスクがありません<br><small>下のフォームから追加できます</small></div>`;
      }

      cat.tasks.forEach(task => {
        const rem  = daysRemaining(task.lastDone, task.cycle);
        const isOverdue = rem < 0, isToday = rem === 0, isSoon = rem > 0 && rem <= 7;

        let countdownClass = 'countdown-ok', countdownText = `あと ${rem}日`;
        if (isOverdue) { countdownClass = 'countdown-overdue'; countdownText = `${Math.abs(rem)}日 超過！`; }
        else if (isToday) { countdownClass = 'countdown-today'; countdownText = '今日やるべき！'; }
        else if (isSoon)  { countdownClass = 'countdown-soon';  countdownText = `あと ${rem}日`; }

        const pct = Math.max(0, Math.min(100, Math.round((rem / task.cycle) * 100)));
        let barColor = '#5a9e6f';
        if (isOverdue) barColor = '#c0392b';
        else if (isToday || isSoon) barColor = '#d4874a';

        const isEditing      = editingTask  && editingTask.catId  === cat.id && editingTask.taskId  === task.id;
        const isEditingDate  = editingDate  && editingDate.catId  === cat.id && editingDate.taskId  === task.id;
        const isEditingCycle = editingCycle && editingCycle.catId === cat.id && editingCycle.taskId === task.id;
        const isEditingMemo  = editingMemo  && editingMemo.catId  === cat.id && editingMemo.taskId  === task.id;
        const memoOpen = openMemos[task.id] || isEditingMemo;
        const hasMemo  = task.memo && task.memo.trim();

        const dateDisplay = isEditingDate
          ? `<input type="date" class="date-edit-input" id="dateInput-${task.id}"
               value="${task.lastDone}"
               data-action="saveDate" data-cat="${cat.id}" data-task="${task.id}">`
          : `<span style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px;"
               data-action="startDateEdit" data-cat="${cat.id}" data-task="${task.id}"
               title="クリックして日付を変更">${formatDate(task.lastDone)} ✏️</span>`;

        const cycleDisplay = isEditingCycle
          ? `<input type="number" class="cycle-edit-input" id="cycleInput-${task.id}"
               value="${task.cycle}" min="1"
               data-action="saveCycle" data-cat="${cat.id}" data-task="${task.id}">日サイクル`
          : `<span style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px;"
               data-action="startCycleEdit" data-cat="${cat.id}" data-task="${task.id}"
               title="クリックして日数を変更">🔁 ${task.cycle}日サイクル ✏️</span>`;

        const memoSection = (() => {
          if (isEditingMemo) return `<div class="memo-row">
            <textarea class="memo-textarea" id="memoInput-${task.id}"
              data-action="saveMemo" data-cat="${cat.id}" data-task="${task.id}"
              placeholder="メモを入力…（Escでキャンセル）">${escapeHtml(task.memo || '')}</textarea>
          </div>`;
          if (memoOpen && hasMemo) return `<div class="memo-row">
            <span class="memo-text">${escapeHtml(task.memo)}</span>
            <button class="memo-toggle" data-action="startMemoEdit" data-cat="${cat.id}" data-task="${task.id}">✏️</button>
          </div>`;
          return '';
        })();

        const memoToggleLabel = hasMemo ? `📝 メモあり` : `＋ メモ`;

        html += `<div class="task-item ${isOverdue ? 'overdue' : ''}"
            draggable="true" data-cat="${cat.id}" data-task="${task.id}">
          <span class="drag-handle" title="ドラッグして並べ替え">⠿</span>
          <div class="task-info">
            <div class="task-name" ${isEditing ? '' : `data-action="startEdit" data-cat="${cat.id}" data-task="${task.id}"`}>
              ${isEditing
                ? `<input class="task-name-edit" id="editInput-${task.id}" value="${escapeHtml(task.name)}"
                     data-action="saveEdit" data-cat="${cat.id}" data-task="${task.id}">`
                : `<span>${escapeHtml(task.name)}</span><span class="edit-hint">✏️</span>`}
            </div>
            <div class="task-meta">
              ${cycleDisplay}
              <span class="task-meta-dot">·</span>
              <span>前回: ${dateDisplay}</span>
              <span class="task-meta-dot">·</span>
              <span>次回: ${nextDate(task.lastDone, task.cycle)}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${pct}%; background: ${barColor};"></div>
            </div>
            ${memoSection}
            <button class="memo-toggle ${hasMemo ? 'has-memo' : ''}"
              data-action="${isEditingMemo ? 'cancelMemoEdit' : (memoOpen && !isEditingMemo ? 'startMemoEdit' : 'toggleMemo')}"
              data-cat="${cat.id}" data-task="${task.id}" style="margin-top:0.3rem;">
              ${isEditingMemo ? '✕ 閉じる' : (memoOpen && hasMemo ? '' : memoToggleLabel)}
            </button>
          </div>
          <span class="countdown-badge ${countdownClass}">${countdownText}</span>
          <button class="btn-complete" data-action="complete" data-cat="${cat.id}" data-task="${task.id}">✅ 完了</button>
          <button class="btn-delete-task" data-action="deleteTask" data-cat="${cat.id}" data-task="${task.id}" title="削除">✕</button>
        </div>`;
      });

      html += `</div>`;
      html += `<div class="add-task-form">
        <input type="text" placeholder="タスク名" id="newTask-${cat.id}" data-action="addTaskEnter" data-cat="${cat.id}">
        <input type="number" placeholder="日数" id="newCycle-${cat.id}" min="1" value="30" data-action="addTaskEnter" data-cat="${cat.id}">
        <button class="btn-add-task" data-action="addTask" data-cat="${cat.id}">追加</button>
      </div>`;
      html += `<div class="delete-category-row">
        <button class="btn-delete-category" data-action="deleteCat" data-cat="${cat.id}">🗑 このカテゴリを削除</button>
      </div>`;
      html += `</div>`;
    }
    html += `</div>`;
  });

  if (addPanelOpen) {
    const emojiHtml = EMOJI_OPTIONS.map(e =>
      `<button class="emoji-btn ${selectedEmoji===e?'selected':''}" data-action="emoji" data-emoji="${e}">${e}</button>`
    ).join('');
    html += `<div class="add-category-panel" id="addCategoryPanel">
      <h3>新しいカテゴリを追加</h3>
      <div class="emoji-row">${emojiHtml}</div>
      <div class="add-row">
        <input type="text" placeholder="カテゴリ名（例: 洗濯機）" id="newCatName" data-action="addCatEnter">
        <button class="btn-add-category" data-action="addCategory">追加する</button>
      </div>
    </div>`;
  }

  container.innerHTML = html;
  updateSummary();
  setupEventDelegation();
}

// ─── Edit functions ───────────────────────────────────────────────────────────
function startEdit(catId, taskId) {
  editingTask = { catId, taskId }; renderApp();
  const input = document.getElementById(`editInput-${taskId}`);
  if (input) { input.focus(); input.select(); }
}
function saveEdit(catId, taskId) {
  const input = document.getElementById(`editInput-${taskId}`);
  if (!input) return;
  const newName = input.value.trim();
  if (newName) {
    const cat = appData.find(c => c.id === catId);
    const task = cat?.tasks.find(t => t.id === taskId);
    if (task && task.name !== newName) { task.name = newName; saveData(); showToast('✏️ タスク名を更新しました'); }
  }
  editingTask = null; renderApp();
}
function cancelEdit() { editingTask = null; renderApp(); }

function startDateEdit(catId, taskId) {
  editingDate = { catId, taskId }; renderApp();
  setTimeout(() => { const i = document.getElementById(`dateInput-${taskId}`); if(i) i.focus(); }, 30);
}
function saveDate(catId, taskId, value) {
  if (!value) return;
  const cat = appData.find(c => c.id === catId);
  const task = cat?.tasks.find(t => t.id === taskId);
  if (task) { task.lastDone = value; saveData(); showToast('📅 前回日付を更新しました'); }
  editingDate = null; renderApp();
}
function cancelDateEdit() { editingDate = null; renderApp(); }

function startCycleEdit(catId, taskId) {
  editingCycle = { catId, taskId }; renderApp();
  setTimeout(() => { const i = document.getElementById(`cycleInput-${taskId}`); if(i){ i.focus(); i.select(); } }, 30);
}
function saveCycle(catId, taskId, value) {
  const n = parseInt(value);
  if (!n || n < 1) { cancelCycleEdit(); return; }
  const cat = appData.find(c => c.id === catId);
  const task = cat?.tasks.find(t => t.id === taskId);
  if (task && task.cycle !== n) { task.cycle = n; saveData(); showToast(`🔁 サイクルを ${n}日 に変更しました`); }
  editingCycle = null; renderApp();
}
function cancelCycleEdit() { editingCycle = null; renderApp(); }

function toggleMemo(catId, taskId) {
  openMemos[taskId] = !openMemos[taskId];
  if (openMemos[taskId]) {
    const cat = appData.find(c => c.id === catId);
    const task = cat?.tasks.find(t => t.id === taskId);
    if (task && !task.memo) editingMemo = { catId, taskId };
  } else { editingMemo = null; }
  renderApp();
  if (editingMemo) setTimeout(() => { const ta = document.getElementById(`memoInput-${taskId}`); if(ta) ta.focus(); }, 30);
}
function startMemoEdit(catId, taskId) {
  openMemos[taskId] = true; editingMemo = { catId, taskId }; renderApp();
  setTimeout(() => { const ta = document.getElementById(`memoInput-${taskId}`); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 30);
}
function saveMemo(catId, taskId) {
  const ta = document.getElementById(`memoInput-${taskId}`);
  if (!ta) return;
  const cat = appData.find(c => c.id === catId);
  const task = cat?.tasks.find(t => t.id === taskId);
  if (task) { task.memo = ta.value; saveData(); }
  editingMemo = null;
  openMemos[taskId] = !!(task && task.memo && task.memo.trim());
  renderApp();
  if (task && task.memo) showToast('📝 メモを保存しました');
}
function cancelMemoEdit(catId, taskId) {
  editingMemo = null;
  const cat = appData.find(c => c.id === catId);
  const task = cat?.tasks.find(t => t.id === taskId);
  openMemos[taskId] = !!(task && task.memo && task.memo.trim());
  renderApp();
}

// ─── Event Delegation ────────────────────────────────────────────────────────
function setupEventDelegation() {
  const container = document.getElementById('mainContent');
  const fresh = container.cloneNode(true);
  container.parentNode.replaceChild(fresh, container);
  const c = document.getElementById('mainContent');

  let dragType = null, dragSrc = null;

  c.addEventListener('dragstart', e => {
    const catHandle = e.target.closest('[data-cat-drag]');
    if (catHandle) {
      dragType = 'cat'; dragSrc = { catId: catHandle.dataset.catDrag };
      e.dataTransfer.effectAllowed = 'move';
      const card = document.getElementById(`card-${catHandle.dataset.catDrag}`);
      setTimeout(() => card && card.classList.add('dragging'), 0);
      return;
    }
    const taskItem = e.target.closest('.task-item[data-task]');
    if (taskItem) {
      dragType = 'task'; dragSrc = { catId: taskItem.dataset.cat, taskId: taskItem.dataset.task };
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => taskItem.classList.add('dragging'), 0);
    }
  });

  c.addEventListener('dragover', e => {
    e.preventDefault();
    if (!dragSrc) return;
    if (dragType === 'cat') {
      const card = e.target.closest('[data-cat-id]');
      if (!card || card.dataset.catId === dragSrc.catId) return;
      c.querySelectorAll('.category-card').forEach(el => el.classList.remove('drag-over-cat'));
      card.classList.add('drag-over-cat');
    } else if (dragType === 'task') {
      const item = e.target.closest('.task-item[data-task]');
      if (!item || item.dataset.cat !== dragSrc.catId || item.dataset.task === dragSrc.taskId) return;
      c.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
      item.classList.add('drag-over');
    }
  });

  c.addEventListener('dragleave', e => {
    e.target.closest('.category-card')?.classList.remove('drag-over-cat');
    e.target.closest('.task-item')?.classList.remove('drag-over');
  });

  c.addEventListener('drop', e => {
    e.preventDefault();
    if (!dragSrc) return;
    if (dragType === 'cat') {
      const card = e.target.closest('[data-cat-id]');
      if (!card) return;
      card.classList.remove('drag-over-cat');
      const toCatId = card.dataset.catId;
      if (toCatId === dragSrc.catId) return;
      const fi = appData.findIndex(c => c.id === dragSrc.catId);
      const ti = appData.findIndex(c => c.id === toCatId);
      if (fi === -1 || ti === -1) return;
      const [m] = appData.splice(fi, 1); appData.splice(ti, 0, m);
      dragSrc = null; dragType = null;
      saveData(); renderApp(); showToast('↕️ カテゴリの順番を変更しました');
    } else if (dragType === 'task') {
      const item = e.target.closest('.task-item[data-task]');
      if (!item) return;
      item.classList.remove('drag-over');
      const toCatId = item.dataset.cat, toTaskId = item.dataset.task;
      if (toCatId !== dragSrc.catId || toTaskId === dragSrc.taskId) return;
      const cat = appData.find(ct => ct.id === toCatId);
      if (!cat) return;
      const fi = cat.tasks.findIndex(t => t.id === dragSrc.taskId);
      const ti = cat.tasks.findIndex(t => t.id === toTaskId);
      if (fi === -1 || ti === -1) return;
      const [m] = cat.tasks.splice(fi, 1); cat.tasks.splice(ti, 0, m);
      dragSrc = null; dragType = null;
      saveData(); renderApp(); showToast('↕️ タスクの順番を変更しました');
    }
  });

  c.addEventListener('dragend', () => {
    c.querySelectorAll('.category-card').forEach(el => el.classList.remove('dragging','drag-over-cat'));
    c.querySelectorAll('.task-item').forEach(el => el.classList.remove('dragging','drag-over'));
    dragSrc = null; dragType = null;
  });

  c.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (btn) {
      if (btn.dataset.action === 'complete')    { completeTask(btn.dataset.cat, btn.dataset.task, btn); return; }
      if (btn.dataset.action === 'deleteTask')  { deleteTask(btn.dataset.cat, btn.dataset.task); return; }
      if (btn.dataset.action === 'deleteCat')   { deleteCategory(btn.dataset.cat); return; }
      if (btn.dataset.action === 'addTask')     { addTask(btn.dataset.cat); return; }
      if (btn.dataset.action === 'addCategory') { addCategory(); return; }
      if (btn.dataset.action === 'emoji')       { selectEmoji(btn.dataset.emoji); return; }
    }
    const nameEl      = e.target.closest('[data-action="startEdit"]');      if (nameEl)      { startEdit(nameEl.dataset.cat, nameEl.dataset.task); return; }
    const dateEl      = e.target.closest('[data-action="startDateEdit"]');  if (dateEl)      { startDateEdit(dateEl.dataset.cat, dateEl.dataset.task); return; }
    const cycleEl     = e.target.closest('[data-action="startCycleEdit"]'); if (cycleEl)     { startCycleEdit(cycleEl.dataset.cat, cycleEl.dataset.task); return; }
    const memoEditEl  = e.target.closest('[data-action="startMemoEdit"]');  if (memoEditEl)  { startMemoEdit(memoEditEl.dataset.cat, memoEditEl.dataset.task); return; }
    const memoToggle  = e.target.closest('[data-action="toggleMemo"]');     if (memoToggle)  { toggleMemo(memoToggle.dataset.cat, memoToggle.dataset.task); return; }
    const memoCancel  = e.target.closest('[data-action="cancelMemoEdit"]'); if (memoCancel)  { cancelMemoEdit(memoCancel.dataset.cat, memoCancel.dataset.task); return; }
    const catHeader   = e.target.closest('[data-action="toggleCatHeader"]');if (catHeader)   { toggleCategory(catHeader.dataset.cat); return; }
  });

  c.addEventListener('change', e => {
    if (e.target.dataset.action === 'saveDate')  saveDate(e.target.dataset.cat, e.target.dataset.task, e.target.value);
    if (e.target.dataset.action === 'saveCycle') saveCycle(e.target.dataset.cat, e.target.dataset.task, e.target.value);
  });

  c.addEventListener('focusout', e => {
    if (e.target.dataset.action === 'saveEdit')   saveEdit(e.target.dataset.cat, e.target.dataset.task);
    if (e.target.dataset.action === 'cancelDate') cancelDateEdit();
    if (e.target.dataset.action === 'saveCycle')  saveCycle(e.target.dataset.cat, e.target.dataset.task, e.target.value);
    if (e.target.dataset.action === 'saveMemo')   saveMemo(e.target.dataset.cat, e.target.dataset.task);
  });

  c.addEventListener('keydown', e => {
    if (e.target.dataset.action === 'saveEdit')     { if(e.key==='Enter') saveEdit(e.target.dataset.cat,e.target.dataset.task); if(e.key==='Escape') cancelEdit(); }
    if (e.target.dataset.action === 'cancelDate')   { if(e.key==='Escape') cancelDateEdit(); }
    if (e.target.dataset.action === 'saveCycle')    { if(e.key==='Enter') saveCycle(e.target.dataset.cat,e.target.dataset.task,e.target.value); if(e.key==='Escape') cancelCycleEdit(); }
    if (e.target.dataset.action === 'saveMemo')     { if(e.key==='Escape') cancelMemoEdit(e.target.dataset.cat,e.target.dataset.task); if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) saveMemo(e.target.dataset.cat,e.target.dataset.task); }
    if (e.target.dataset.action === 'addTaskEnter') { if(e.key==='Enter') addTask(e.target.dataset.cat); }
    if (e.target.dataset.action === 'addCatEnter')  { if(e.key==='Enter') addCategory(); }
  });
}

// ─── Actions ─────────────────────────────────────────────────────────────────
function toggleCategory(catId) {
  const cat = appData.find(c => c.id === catId);
  if (cat) { cat.open = !cat.open; saveData(); renderApp(); }
}

function completeTask(catId, taskId, btn) {
  const cat = appData.find(c => c.id === catId); if (!cat) return;
  const task = cat.tasks.find(t => t.id === taskId); if (!task) return;
  task.lastDone = todayStr();
  saveData();
  btn && btn.classList.add('pop');
  showToast(`✅ 「${task.name}」を完了しました！`);
  setTimeout(() => renderApp(), 280);
}

function deleteTask(catId, taskId) {
  const cat = appData.find(c => c.id === catId); if (!cat) return;
  const task = cat.tasks.find(t => t.id === taskId); if (!task) return;
  const name = task.name;
  cat.tasks = cat.tasks.filter(t => t.id !== taskId);
  saveData(); renderApp(); showToast(`🗑 「${name}」を削除しました`);
}

function addTask(catId) {
  const nameEl = document.getElementById(`newTask-${catId}`);
  const cycleEl = document.getElementById(`newCycle-${catId}`);
  const name = nameEl.value.trim(), cycle = parseInt(cycleEl.value);
  if (!name) { nameEl.focus(); return; }
  if (!cycle || cycle < 1) { cycleEl.focus(); return; }
  const cat = appData.find(c => c.id === catId); if (!cat) return;
  cat.tasks.push({ id: uid(), name, cycle, lastDone: todayStr(), memo: '' });
  saveData(); renderApp(); showToast(`➕ 「${name}」を追加しました`);
}

function deleteCategory(catId) {
  const cat = appData.find(c => c.id === catId); if (!cat) return;
  const name = cat.name;
  appData = appData.filter(c => c.id !== catId);
  saveData(); renderApp(); showToast(`🗑 「${name}」カテゴリを削除しました`);
}

function selectEmoji(e) {
  selectedEmoji = e; renderApp();
  setTimeout(() => document.getElementById('newCatName')?.focus(), 50);
}

function addCategory() {
  const nameEl = document.getElementById('newCatName');
  const name = nameEl.value.trim(); if (!name) { nameEl.focus(); return; }
  appData.push({ id: uid(), name, icon: selectedEmoji, open: true, tasks: [] });
  saveData();
  addPanelOpen = false;
  document.getElementById('fabIcon').textContent = '＋';
  document.getElementById('fabLabel').textContent = 'カテゴリ追加';
  renderApp(); showToast(`🏷 「${name}」カテゴリを追加しました`);
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
document.getElementById('fabBtn').addEventListener('click', toggleAddPanel);

// Firestore リアルタイム同期スタート
startRealtimeSync();
</script>
